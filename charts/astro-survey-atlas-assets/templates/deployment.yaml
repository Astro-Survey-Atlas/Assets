apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astro-survey-atlas-assets.fullname" . }}
  labels:
    {{- include "astro-survey-atlas-assets.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.splitRoles.enabled }}
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astro-survey-atlas-assets.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "astro-survey-atlas-assets.labels" . | nindent 8 }}
        app.kubernetes.io/component: site
    spec:
      {{- if and .Values.admin.enabled (not .Values.splitRoles.enabled) }}
      serviceAccountName: {{ include "astro-survey-atlas-assets.fullname" . }}-admin
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: publish-assets
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/server/sync-release.js"]
          env:
            - name: ASSET_TARGET_ROOT
              value: /data
            - name: ASSETS_RELEASE_ALLOW_INSTALLED_FALLBACK
              value: "true"
            - name: ASSETS_OBJECT_STORE_CURRENT_KEY
              value: {{ .Values.objectStore.currentKey | quote }}
            - name: ASSETS_OBJECT_STORE_REQUIRED
              value: "1"
            - name: ASSETS_RELEASE_RETENTION
              value: {{ .Values.objectStore.retainReleases | quote }}
            - name: ASSETS_RELEASE_CLEANUP
              value: {{ .Values.objectStore.cleanup | quote }}
            - name: ASSETS_OBJECT_STORE_ENDPOINT
              value: {{ .Values.objectStore.endpoint | quote }}
            - name: ASSETS_OBJECT_STORE_BUCKET
              value: {{ .Values.objectStore.bucket | quote }}
            - name: ASSETS_OBJECT_STORE_PREFIX
              value: {{ .Values.objectStore.prefix | quote }}
            - name: ASSETS_OBJECT_STORE_REGION
              value: {{ .Values.objectStore.region | quote }}
            - name: ASSETS_OBJECT_STORE_FORCE_PATH_STYLE
              value: {{ .Values.objectStore.forcePathStyle | quote }}
            - name: ASSETS_OBJECT_STORE_REQUEST_TIMEOUT_MS
              value: {{ .Values.objectStore.requestTimeoutMs | quote }}
            {{- if .Values.objectStore.credentialsSecret.name }}
            - name: ASSETS_OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.credentialsSecret.name }}
                  key: {{ .Values.objectStore.credentialsSecret.accessKeyIdKey | quote }}
            - name: ASSETS_OBJECT_STORE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.credentialsSecret.name }}
                  key: {{ .Values.objectStore.credentialsSecret.secretAccessKeyKey | quote }}
            {{- if .Values.objectStore.credentialsSecret.sessionTokenKey }}
            - name: ASSETS_OBJECT_STORE_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.credentialsSecret.name }}
                  key: {{ .Values.objectStore.credentialsSecret.sessionTokenKey | quote }}
                  optional: true
            {{- end }}
            {{- end }}
          resources: {{ toYaml .Values.syncResources | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: assets
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: site
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4180
          env:
            {{- if .Values.splitRoles.enabled }}
            - name: ASSETS_ROLE
              value: site
            - name: ASSETS_BACKEND_URL
              value: http://{{ include "astro-survey-atlas-assets.fullname" . }}-backend:4180
            {{- end }}
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "4180"
            - name: ASSET_RELEASE_ROOT
              value: /data/current
            - name: ASSETS_WORKSPACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.regionAccess.secretName | quote }}
                  key: workspace-api-key
            - name: PUBLIC_SITE_ROOT
              value: /app/site
            - name: ASSETS_CONTENT_ROOT
              value: /var/lib/assets-content
            - name: ASSETS_EVIDENCE_ROOT
              value: /var/lib/assets-evidence
            - name: ASSETS_UPLOAD_SPOOL_ROOT
              value: {{ .Values.releasePublisher.uploadSpoolRoot | quote }}
            - name: ASSETS_OBJECT_STORE_REQUIRED
              value: "1"
            - name: ASSETS_OBJECT_STORE_CURRENT_KEY
              value: {{ .Values.objectStore.currentKey | quote }}
            - name: ASSETS_OBJECT_STORE_ENDPOINT
              value: {{ .Values.objectStore.endpoint | quote }}
            - name: ASSETS_OBJECT_STORE_BUCKET
              value: {{ .Values.objectStore.bucket | quote }}
            - name: ASSETS_OBJECT_STORE_PREFIX
              value: {{ .Values.objectStore.prefix | quote }}
            - name: ASSETS_OBJECT_STORE_REGION
              value: {{ .Values.objectStore.region | quote }}
            - name: ASSETS_OBJECT_STORE_FORCE_PATH_STYLE
              value: {{ .Values.objectStore.forcePathStyle | quote }}
            - name: ASSETS_OBJECT_STORE_REQUEST_TIMEOUT_MS
              value: {{ .Values.objectStore.requestTimeoutMs | quote }}
            - name: ASSETS_OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "objectStore.credentialsSecret.name is required for the site" .Values.objectStore.credentialsSecret.name }}
                  key: {{ .Values.objectStore.credentialsSecret.accessKeyIdKey | quote }}
            - name: ASSETS_OBJECT_STORE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.credentialsSecret.name }}
                  key: {{ .Values.objectStore.credentialsSecret.secretAccessKeyKey | quote }}
            {{- if .Values.objectStore.credentialsSecret.sessionTokenKey }}
            - name: ASSETS_OBJECT_STORE_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStore.credentialsSecret.name }}
                  key: {{ .Values.objectStore.credentialsSecret.sessionTokenKey | quote }}
                  optional: true
            {{- end }}
            - name: MOC_BUILDER_SCRIPT
              value: /app/scripts/moc_build_worker.py
            - name: ASSETS_ADMIN_ENABLED
              value: {{ .Values.admin.enabled | quote }}
            - name: ASSETS_PUBLIC_VERIFY_URL
              value: {{ .Values.admin.publicVerifyUrl | quote }}
            - name: ASSETS_WAREHOUSE_NAMESPACE
              value: {{ .Values.admin.warehouseNamespace | quote }}
            - name: ASSETS_DISCOVERY_OBSERVER_NAMESPACE
              value: {{ .Values.admin.discoveryObserverNamespace | default "atlas-system" | quote }}
            - name: ASSETS_DISCOVERY_OBSERVER_SELECTOR
              value: {{ .Values.admin.discoveryObserverSelector | default "app.kubernetes.io/name=astro-atlas-moc-discovery" | quote }}
            - name: ASSETS_DISCOVERY_ACCEPT_TIMEOUT_SECONDS
              value: {{ .Values.admin.discoveryAcceptTimeoutSeconds | default 120 | quote }}
            - name: ASSETS_WAREHOUSE_SCANNER_IMAGE
              value: {{ .Values.admin.warehouseScannerImage | quote }}
            - name: ASSETS_WAREHOUSE_EVIDENCE_CLAIM
              value: {{ .Values.admin.warehouseEvidenceClaim | quote }}
            - name: ASSETS_WAREHOUSE_EVIDENCE_MOUNT_PATH
              value: {{ .Values.admin.warehouseEvidenceMountPath | quote }}
            - name: ASSETS_WAREHOUSE_ES_URL
              value: {{ .Values.warehouse.elasticsearchUrl | quote }}
            - name: ASSETS_WAREHOUSE_LAYER_INDEX
              value: {{ .Values.warehouse.layerIndex | quote }}
            - name: ASSETS_WAREHOUSE_COVERAGE_INDEX
              value: {{ .Values.warehouse.coverageIndex | quote }}
            - name: ASSETS_WAREHOUSE_FILE_INDEX
              value: {{ .Values.warehouse.fileIndex | quote }}
            - name: ASSETS_WAREHOUSE_EXCLUDED_LAYER_IDS
              value: {{ join "," .Values.warehouse.excludedLayerIds | quote }}
            {{- if .Values.admin.enabled }}
            - name: ASSETS_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "admin.adminTokenSecret.name is required when admin.enabled is true" .Values.admin.adminTokenSecret.name }}
                  key: {{ .Values.admin.adminTokenSecret.key | quote }}
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: assets
              mountPath: /data
              readOnly: {{ not .Values.splitRoles.enabled }}
            {{- if not .Values.splitRoles.enabled }}
            - name: content
              mountPath: /var/lib/assets-content
              readOnly: false
            - name: evidence
              mountPath: /var/lib/assets-evidence
              readOnly: false
            - name: upload-spool
              mountPath: {{ .Values.releasePublisher.uploadSpoolRoot }}
              readOnly: false
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: {{ if .Values.splitRoles.enabled }}{{ include "astro-survey-atlas-assets.fullname" . }}-site-cache{{ else }}{{ default (printf "%s-assets" (include "astro-survey-atlas-assets.fullname" .)) .Values.persistence.existingClaim }}{{ end }}
        {{- if not .Values.splitRoles.enabled }}
        - name: content
          {{- if .Values.contentPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-content" (include "astro-survey-atlas-assets.fullname" .)) .Values.contentPersistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: evidence
          {{- if .Values.evidencePersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-evidence" (include "astro-survey-atlas-assets.fullname" .)) .Values.evidencePersistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: upload-spool
          {{- if .Values.uploadSpoolPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-upload-spool" (include "astro-survey-atlas-assets.fullname" .)) .Values.uploadSpoolPersistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
