apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "astro-survey-atlas-assets.fullname" . }}
  labels:
    {{- include "astro-survey-atlas-assets.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "astro-survey-atlas-assets.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "astro-survey-atlas-assets.labels" . | nindent 8 }}
    spec:
      {{- if .Values.admin.enabled }}
      serviceAccountName: {{ include "astro-survey-atlas-assets.fullname" . }}-admin
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: publish-assets
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/server/sync-release.js"]
          env:
            - name: ASSET_SOURCE_ROOT
              value: /app/release
            - name: ASSET_TARGET_ROOT
              value: /data
          resources: {{ toYaml .Values.syncResources | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: assets
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: site
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 4180
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "4180"
            - name: ASSET_RELEASE_ROOT
              value: /data/current
            - name: PUBLIC_SITE_ROOT
              value: /app/site
            - name: ASSETS_CONTENT_ROOT
              value: /var/lib/assets-content
            - name: ASSETS_ADMIN_ENABLED
              value: {{ .Values.admin.enabled | quote }}
            - name: ASSETS_WAREHOUSE_NAMESPACE
              value: {{ .Values.admin.warehouseNamespace | quote }}
            - name: ASSETS_LOCAL_PATH_ROOT
              value: {{ .Values.admin.localPathRoot | quote }}
            - name: ASSETS_WAREHOUSE_SCANNER_IMAGE
              value: {{ .Values.admin.warehouseScannerImage | quote }}
            - name: ASSETS_WAREHOUSE_EVIDENCE_CLAIM
              value: {{ .Values.admin.warehouseEvidenceClaim | quote }}
            - name: ASSETS_WAREHOUSE_EVIDENCE_MOUNT_PATH
              value: {{ .Values.admin.warehouseEvidenceMountPath | quote }}
            - name: ASSETS_WAREHOUSE_ES_URL
              value: {{ .Values.warehouse.elasticsearchUrl | quote }}
            - name: ASSETS_WAREHOUSE_LAYER_INDEX
              value: {{ .Values.warehouse.layerIndex | quote }}
            - name: ASSETS_WAREHOUSE_COVERAGE_INDEX
              value: {{ .Values.warehouse.coverageIndex | quote }}
            - name: ASSETS_WAREHOUSE_FILE_INDEX
              value: {{ .Values.warehouse.fileIndex | quote }}
            {{- if .Values.admin.enabled }}
            - name: ASSETS_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "admin.adminTokenSecret.name is required when admin.enabled is true" .Values.admin.adminTokenSecret.name }}
                  key: {{ .Values.admin.adminTokenSecret.key | quote }}
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources: {{ toYaml .Values.resources | nindent 12 }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: assets
              mountPath: /data
              readOnly: true
            - name: content
              mountPath: /var/lib/assets-content
              readOnly: false
            - name: evidence
              mountPath: /var/lib/assets-evidence
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-assets" (include "astro-survey-atlas-assets.fullname" .)) .Values.persistence.existingClaim }}
        - name: content
          {{- if .Values.contentPersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-content" (include "astro-survey-atlas-assets.fullname" .)) .Values.contentPersistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: evidence
          {{- if .Values.evidencePersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-evidence" (include "astro-survey-atlas-assets.fullname" .)) .Values.evidencePersistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
