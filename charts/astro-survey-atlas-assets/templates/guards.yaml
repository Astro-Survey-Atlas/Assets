{{- if and (eq .Values.service.type "ClusterIP") .Values.service.nodePort }}{{ fail "service.nodePort is only valid with service.type=NodePort" }}{{- end }}
{{- if and (eq .Values.service.type "NodePort") (not .Values.service.nodePort) }}{{ fail "service.nodePort is required with service.type=NodePort" }}{{- end }}
{{- if and (not .Values.persistence.enabled) (not .Values.persistence.existingClaim) }}{{ fail "verified public assets require persistence.enabled or persistence.existingClaim" }}{{- end }}
{{- if and .Values.persistence.enabled .Values.persistence.existingClaim }}{{ fail "persistence.enabled and persistence.existingClaim cannot both provision storage" }}{{- end }}
{{- if and .Values.admin.enabled (not .Values.admin.warehouseNamespace) }}{{ fail "admin.warehouseNamespace is required when admin.enabled is true" }}{{- end }}
{{- if and .Values.objectStore.enabled (not .Values.objectStore.endpoint) }}{{ fail "objectStore.endpoint is required when objectStore.enabled is true" }}{{- end }}
{{- if and .Values.objectStore.enabled (not .Values.objectStore.bucket) }}{{ fail "objectStore.bucket is required when objectStore.enabled is true" }}{{- end }}
{{- if and .Values.objectStore.enabled (not .Values.objectStore.credentialsSecret.name) }}{{ fail "objectStore.credentialsSecret.name is required when objectStore.enabled is true" }}{{- end }}
{{- if not (has .Values.objectStore.mode (list "filesystem" "push" "pull")) }}{{ fail "objectStore.mode must be filesystem, push or pull" }}{{- end }}
{{- if and (eq .Values.objectStore.mode "pull") (not .Values.objectStore.enabled) }}{{ fail "objectStore.enabled must be true when objectStore.mode=pull" }}{{- end }}
{{- if and (eq .Values.objectStore.mode "push") (not .Values.objectStore.enabled) }}{{ fail "objectStore.enabled must be true when objectStore.mode=push" }}{{- end }}
