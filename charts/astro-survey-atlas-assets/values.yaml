replicaCount: 1

image:
  # Public mirrors: ghcr.io/astro-survey-atlas/assets (identical digest).
  repository: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/astro-survery-atlas/astro-survey-atlas-assets
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

admin:
  enabled: false
  # Optional fixed public site URL used for post-publication verification.
  publicVerifyUrl: ""
  warehouseNamespace: atlas-warehouse
  discoveryObserverNamespace: atlas-system
  discoveryObserverSelector: app.kubernetes.io/name=astro-atlas-moc-discovery
  discoveryAcceptTimeoutSeconds: 120
  warehouseScannerImage: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-atlas-scanner:0.2.0-20260826-shutdownfix1
  warehouseEvidenceClaim: atlas-evidence
  warehouseEvidenceMountPath: /var/lib/atlas-evidence
  adminTokenSecret:
    name: ""
    key: token

warehouse:
  elasticsearchUrl: http://atlas-warehouse-elasticsearch.atlas-warehouse.svc.cluster.local:9200
  layerIndex: ast_layer_index_v1
  coverageIndex: ast_coverage_index_v1
  fileIndex: ast_file_index_v1
  # Evidence-only smoke/self-test layers must never enter the public catalog.
  excludedLayerIds:
    - assets-atlas-catalog-gaia-current
    - assets-smoke-catalog-gaia
    - warehouse-caller-assets
    - warehouse-selftest-s3
    - smoke-catalog
    - assets-smoke-image-euclid-vis
    - assets-atlas-spectrum-sdss-current

service:
  type: ClusterIP
  port: 80
  nodePort: null

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: astro.assets.dev.72602.space
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi

contentPersistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 64Mi

evidencePersistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 256Gi

uploadSpoolPersistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

syncResources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Builds candidate release trees, packages deterministic archives and uploads
# them to the object store. Shares the content PVC with the site so queued
# publication runs survive restarts.
releasePublisher:
  enabled: true
  pollSeconds: 5
  leaseMs: 600000
  uploadSpoolRoot: /var/lib/assets-upload-spool
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# The init container always pulls one immutable release archive. Chart render
# fails unless endpoint/bucket/credentialsSecret are all set; leave
# defaults empty so accidental deploys without an overlay cannot start.
objectStore:
  currentKey: public/current.json
  retainReleases: 2
  cleanup: false
  endpoint: ""
  bucket: ""
  prefix: ""
  region: us-east-1
  forcePathStyle: true
  credentialsSecret:
    name: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key
    sessionTokenKey: session-token

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

regionAccess:
  secretName: astro-survey-atlas-assets-region-access
