apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mocbuildrequests.assets.zhejianglab.org
spec:
  group: assets.zhejianglab.org
  scope: Namespaced
  names:
    plural: mocbuildrequests
    singular: mocbuildrequest
    kind: MocBuildRequest
    shortNames: [mocbuild]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Candidate
          type: string
          jsonPath: .spec.candidateId
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [discoveryRequestName, provider, candidateId, sourceUrl]
              properties:
                discoveryRequestName: { type: string, minLength: 1, maxLength: 63 }
                provider: { type: string, enum: [cds] }
                candidateId: { type: string, minLength: 1, maxLength: 2048 }
                sourceUrl: { type: string, maxLength: 2048 }
                surveyId: { type: string, maxLength: 128 }
                releaseId: { type: string, maxLength: 160 }
                productId: { type: string, maxLength: 128 }
                workKey: { type: string, maxLength: 256 }
                workTitle: { type: string, maxLength: 255 }
            status:
              type: object
              properties:
                phase: { type: string, enum: [QUEUED, FETCHING, SNAPSHOT_LOCKED, VALIDATING, BUILDING, PROJECTING, BUNDLING, STAGED, FAILED, DUPLICATE] }
                progress:
                  type: object
                  properties:
                    step: { type: integer, minimum: 0 }
                    totalSteps: { type: integer, minimum: 1 }
                    percent: { type: integer, minimum: 0, maximum: 100 }
                    message: { type: string, maxLength: 2048 }
                sourceSnapshotSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                sourceSizeBytes: { type: integer, format: int64, minimum: 0 }
                evidencePath: { type: string, maxLength: 2048 }
                duplicateOf: { type: string, maxLength: 63 }
                error:
                  type: object
                  properties:
                    reason: { type: string, maxLength: 128 }
                    message: { type: string, maxLength: 2048 }
                outputs:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
