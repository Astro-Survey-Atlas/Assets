name: Code Release

on:
  push:
    tags:
      - 'code-v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable code tag, for example code-v0.0.2
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: code-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/requirements.lock

      - name: Resolve code release coordinates
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TAG="$REQUESTED_TAG"; else TAG="$GITHUB_REF_NAME"; fi
          if [[ ! "$TAG" =~ ^code-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "tag must use code-vX.Y.Z" >&2
            exit 1
          fi
          VERSION="${TAG#code-v}"
          PKG="$(node -p "require('./package.json').version")"
          CHART="$(awk '/^version:/ {print $2}' charts/astro-survey-atlas-assets/Chart.yaml)"
          APP="$(awk '/^appVersion:/ {gsub(/\"/,""); print $2}' charts/astro-survey-atlas-assets/Chart.yaml)"
          [ "$VERSION" = "$PKG" ] || { echo "package.json is $PKG, expected $VERSION"; exit 1; }
          [ "$VERSION" = "$CHART" ] || { echo "Chart.yaml is $CHART, expected $VERSION"; exit 1; }
          [ "$VERSION" = "$APP" ] || { echo "Chart.yaml appVersion is $APP, expected $VERSION"; exit 1; }
          SOURCE_SHA="$(git rev-parse HEAD)"
          git show-ref --verify --quiet "refs/tags/$TAG" || { echo "immutable code tag $TAG is missing"; exit 1; }
          [ "$(git rev-parse "$TAG^{commit}")" = "$SOURCE_SHA" ] || { echo "checkout does not match tag $TAG"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "chart=oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/astro-survey-atlas-assets" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements/requirements.lock
          python -m pip install --no-deps vendor/moc-core/astro_survey_moc_core-1.2.0-py3-none-any.whl

      - name: Validate code without public data storage
        run: |
          npm run build:server
          npm run build:site
          npm run test:core
          npm run test:node:code
          npm run test:python
          npx tsc -p tsconfig.server.json --noEmit
          npx tsc --noEmit -p tsconfig.site.json
          npx vite build

      - name: Lint and template Helm chart
        run: |
          helm lint charts/astro-survey-atlas-assets \
            -f charts/astro-survey-atlas-assets/examples/values-development.yaml
          helm lint charts/astro-survey-atlas-assets \
            -f charts/astro-survey-atlas-assets/examples/values-production.yaml
          helm template release-audit charts/astro-survey-atlas-assets \
            --namespace astro-survey-atlas-assets \
            -f charts/astro-survey-atlas-assets/examples/values-development.yaml > /dev/null

      - name: Build and push image (GHCR)
        id: image
        env:
          GHCR_IMAGE: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
          GHCR_SHA_IMAGE: ${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.source_sha }}
        run: |
          docker login ghcr.io -u "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
          docker buildx build \
            --platform linux/amd64 \
            --tag "$GHCR_IMAGE" \
            --tag "$GHCR_SHA_IMAGE" \
            --push \
            .
          DIGEST="$(docker buildx imagetools inspect "$GHCR_IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Mirror image to Aliyun registry
        env:
          GHCR_IMAGE: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
          GHCR_SHA_IMAGE: ${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.source_sha }}
          ALIYUN_REGISTRY: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com
          ALIYUN_IMAGE: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/astro-survery-atlas/astro-survey-atlas-assets
        run: |
          docker login "$ALIYUN_REGISTRY" -u "${{ secrets.ALIYUN_REGISTRY_USERNAME }}" --password "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"
          docker buildx imagetools create --tag "$ALIYUN_IMAGE:${{ steps.version.outputs.tag }}" "$GHCR_IMAGE"
          docker buildx imagetools create --tag "$ALIYUN_IMAGE:sha-${{ steps.version.outputs.source_sha }}" "$GHCR_SHA_IMAGE"

      - name: Package and push Helm chart (GHCR OCI)
        env:
          CHART: ${{ steps.version.outputs.chart }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p dist/chart
          helm package charts/astro-survey-atlas-assets --destination dist/chart
          helm push dist/chart/*.tgz "$CHART"

      - name: Stage code release information
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.source_sha }}
          RELEASE_IMAGE: ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
          RELEASE_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_IMAGE_MIRROR: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/astro-survery-atlas/astro-survey-atlas-assets:${{ steps.version.outputs.tag }}
          RELEASE_CHART: ${{ steps.version.outputs.chart }}
          RELEASE_ASSET_OUTPUT_ROOT: ${{ github.workspace }}/dist/code-assets
          RELEASE_NOTES_PATH: ${{ github.workspace }}/dist/CODE-RELEASE-NOTES.md
        run: node --import tsx scripts/stage-code-release.ts

      - name: Checksums
        run: |
          cd dist/code-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create code GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.source_sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --title "Astro Survey Atlas Assets $RELEASE_VERSION (code)" \
            --notes-file dist/CODE-RELEASE-NOTES.md \
            dist/code-assets/*
