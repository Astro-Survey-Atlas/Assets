[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-survey-moc-core"
version = "1.0.0"
description = "Deterministic, offline Astro Survey MOC Core SDK and resource-package tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "astropy>=6.0",
  "astropy-healpix>=1.0",
  "mocpy>=0.20",
  "regions>=0.8",
  "numpy>=1.24",
]

[project.scripts]
astro-survey-moc-core = "astro_survey_moc_core.cli:main"

[tool.setuptools.packages.find]
include = ["astro_survey_moc_core*"]

[tool.pytest.ini_options]
testpaths = ["python-tests"]
