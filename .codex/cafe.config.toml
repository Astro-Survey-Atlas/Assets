model_provider = "cafe"
model = "gpt-5.6-luna"
model_reasoning_effort = "max"
plan_mode_reasoning_effort = "xhigh"

[model_providers.cafe]
name = "Cafe OpenAI-compatible API"
base_url = "https://token.72602.space/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
requires_openai_auth = false

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[features]
multi_agent_v2 = false

[tui]
status_line = [
    "model-with-reasoning",
    "context-used",
    "context-window-size",
    "session-id"
]