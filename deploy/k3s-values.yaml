image:
  repository: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-survey-atlas-assets
  tag: "1.0.0"
  pullPolicy: Always

imagePullSecrets:
  - name: aliyun-registry

warehouse:
  elasticsearchUrl: http://warehouse-elasticsearch.warehouse.svc.cluster.local:9200
  layerIndex: ast_layer_index_v1
  coverageIndex: ast_coverage_index_v1
  fileIndex: ast_file_index_v1

admin:
  enabled: true
  warehouseNamespace: warehouse
  warehouseScannerImage: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-atlas-scanner:0.2.0-20260825-fix3
  warehouseEvidenceClaim: atlas-evidence-smoke
  warehouseEvidenceMountPath: /var/lib/atlas-evidence
  adminTokenSecret:
    name: astro-survey-atlas-assets-admin
    key: token

service:
  type: NodePort
  port: 80
  nodePort: 32083

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "480"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "480"
  hosts:
    - host: astro.assets.dev.72602.space
      paths:
        - path: /
          pathType: Prefix

persistence:
  enabled: true
  existingClaim: ""
  storageClass: nfs-data
  accessModes: [ReadWriteOnce]
  size: 256Mi

evidencePersistence:
  enabled: true
  existingClaim: ""
  storageClass: nfs-data
  accessModes: [ReadWriteOnce]
  size: 256Gi

# A single overlap can retain the public catalog, a DESI source-unit worker
# and bounded warehouse evidence responses at the same time.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

syncResources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  kubernetes.io/hostname: eva7028
