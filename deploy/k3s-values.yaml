image:
  repository: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-survey-atlas-assets
  tag: "0.1.0-20260826-123500"
  pullPolicy: Always

imagePullSecrets:
  - name: aliyun-registry

warehouse:
  elasticsearchUrl: http://atlas-warehouse-elasticsearch.atlas-warehouse.svc.cluster.local:9200
  layerIndex: ast_layer_index_v1
  coverageIndex: ast_coverage_index_v1
  fileIndex: ast_file_index_v1
  excludedLayerIds:
    - assets-atlas-catalog-gaia-current
    - assets-smoke-catalog-gaia
    - warehouse-caller-assets
    - warehouse-selftest-s3

admin:
  enabled: true
  warehouseNamespace: atlas-warehouse
  warehouseScannerImage: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-atlas-scanner:0.2.0-20260829-pvc1
  warehouseEvidenceClaim: atlas-evidence-smoke
  warehouseEvidenceMountPath: /var/lib/atlas-evidence
  adminTokenSecret:
    name: astro-survey-atlas-assets-admin
    key: token

service:
  type: NodePort
  port: 80
  nodePort: 32083

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "480"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "480"
  hosts:
    - host: astro.assets.dev.72602.space
      paths:
        - path: /
          pathType: Prefix

persistence:
  enabled: true
  existingClaim: ""
  storageClass: nfs-data
  accessModes: [ReadWriteOnce]
  size: 256Mi

evidencePersistence:
  enabled: true
  existingClaim: ""
  storageClass: nfs-data
  accessModes: [ReadWriteOnce]
  size: 256Gi

# A single overlap can retain the public catalog, a DESI source-unit worker
# and bounded warehouse evidence responses at the same time.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

syncResources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Development cluster uses the image/PVC release path. Production overlays
# must set mode=pull, endpoint, bucket and a credentials Secret.
objectStore:
  enabled: false
  mode: filesystem
  currentKey: public/current.json
  retainReleases: 2
  cleanup: false

nodeSelector:
  kubernetes.io/hostname: eva7028
